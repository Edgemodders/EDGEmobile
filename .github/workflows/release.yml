# Builds EDGEmobile's zip (EDGEmobile and EDGEphone) and Chooms!'s zip, laid out like the game
# folder (tools/release/zip.mjs). The same zips go to the GitHub release and to Nexus Mods.
#
#   Run workflow (Actions tab)                  test zips (named -draft, without the changelog
#                                               checks), kept as the run's artifact
#   Run workflow, "Make a release" ticked       also tags the commit v<EDGEmobile's version> and
#                                               makes the GitHub release with both zips; stops
#                                               first if that tag exists (raise the version in
#                                               edgemobile/rednode-app.json, edgemobile/package.json
#                                               and edgephone/rednode-app.json), if a changelog has
#                                               changes under Unreleased or no section for its
#                                               version (docs/changelog.md, docs/chooms/changelog.md),
#                                               or if README.md's status line and badge do not say
#                                               the version released (tools/release/readme-check.mjs)
#   ... and "Update Nexus Mods" ticked          also uploads each zip to its Nexus page as the main
#                                               file's new version, with its changelog and the page's
#                                               description (the Nexus tool, from EDGErepo at the tag
#                                               v1; the organization's NEXUS_KEY secret). A page is
#                                               updated only once its folder exists: nexus/ for
#                                               EDGEmobile, chooms/nexus/ for Chooms! (made with
#                                               node ../EDGErepo/tools/nexus/nexus.mjs pull after the
#                                               page is created on Nexus). Chooms! is uploaded only
#                                               when its version is not on its page yet.
#
# Release gate: make a release only after every in-game test of the builds since the last
# release has passed (docs/design.md). Untested or failed means no release.

name: Release zip

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<version>). Only after every in-game test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the zips, their changelogs and the pages' descriptions
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edgemobile/package-lock.json

      - name: Versions
        run: |
          $mobile = (Get-Content edgemobile/rednode-app.json -Raw | ConvertFrom-Json).version
          $chooms = (Get-Content chooms/rednode/rednode-app.json -Raw | ConvertFrom-Json).version
          "MOBILE=$mobile" >> $env:GITHUB_ENV
          "CHOOMS=$chooms" >> $env:GITHUB_ENV
          Write-Output "EDGEmobile $mobile, Chooms! $chooms"

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/v$env:MOBILE" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::v$env:MOBILE is already released. Raise EDGEmobile's version first."
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: The README says this release
        if: inputs.release
        run: node tools/release/readme-check.mjs --version $env:MOBILE

      - name: Release notes from the changelogs
        if: inputs.release
        run: |
          node tools/release/notes.mjs $env:MOBILE --out "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/release/notes.mjs $env:MOBILE --nexus --out "$env:RUNNER_TEMP/nexus-notes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/release/notes.mjs $env:CHOOMS --nexus --changelog docs/chooms/changelog.md --out "$env:RUNNER_TEMP/chooms-nexus-notes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The Nexus tool, shared by the Edgemodders repos at this tag. Outside the workspace, so
      # nothing packs it.
      - name: The Nexus tool
        if: inputs.release && inputs.nexus
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch v1 https://github.com/Edgemodders/EDGErepo "$env:RUNNER_TEMP/EDGErepo"

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $nexus = "$env:RUNNER_TEMP/EDGErepo/tools/nexus/nexus.mjs"
          if (Test-Path nexus/nexus.json) {
            node $nexus check --version $env:MOBILE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else { Write-Output "::warning::No nexus/nexus.json yet: EDGEmobile's Nexus page is left alone." }
          if (Test-Path chooms/nexus/nexus.json) {
            node $nexus check chooms/nexus --version $env:CHOOMS
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else { Write-Output "::warning::No chooms/nexus/nexus.json yet: Chooms!'s Nexus page is left alone." }

      - name: Build the zips
        run: |
          if ('${{ inputs.release }}' -eq 'true') { node tools/release/zip.mjs } else { node tools/release/zip.mjs --draft }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: EDGEmobile-zips
          path: release/*.zip
          if-no-files-found: error

      - name: GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:MOBILE" "release/EDGEmobile-$env:MOBILE.zip" "release/Chooms-$env:CHOOMS.zip" --target $env:GITHUB_SHA --title "EDGEmobile $env:MOBILE" --notes-file "$env:RUNNER_TEMP/notes.md" --generate-notes

      - name: Nexus Mods
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $nexus = "$env:RUNNER_TEMP/EDGErepo/tools/nexus/nexus.mjs"
          if (Test-Path nexus/nexus.json) {
            node $nexus release --version $env:MOBILE --zip "release/EDGEmobile-$env:MOBILE.zip" --notes "$env:RUNNER_TEMP/nexus-notes.txt"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if (Test-Path chooms/nexus/nexus.json) {
            node $nexus release chooms/nexus --version $env:CHOOMS --zip "release/Chooms-$env:CHOOMS.zip" --notes "$env:RUNNER_TEMP/chooms-nexus-notes.txt"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
