<!doctype html>
<!-- EDGEmobile's phone page, served by the player's PC through the tunnel. M2: pairing and a connected screen; the home screen comes in M3. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>EDGEmobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/theme/nc.css">
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg-000); }
  body { padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 24px); }
  main { display: grid; gap: 16px; max-width: 480px; margin: 0 auto; }
  h1 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  h1 span { color: var(--yellow); }
  .status { font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); }
  .status.ok { color: var(--green); }
  .status.bad { color: var(--red); }
  .code { font-family: var(--font-mono); font-size: 44px; line-height: 1.1; letter-spacing: .12em; color: var(--yellow); text-align: center; margin: 8px 0; }
  .clock { font-family: var(--font-display); font-size: 64px; line-height: 1; font-weight: 700; color: var(--ink); }
  .rule { height: 2px; width: 64px; background: var(--red); margin: 12px 0 8px; }
  .date { color: var(--ink-dim); }
  .dim { opacity: .45; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="nc nc-grid">
<main>
  <header>
    <h1>EDGE<span>mobile</span></h1>
    <div id="status" class="status">Starting…</div>
  </header>

  <section id="pairing" class="nc-panel nc-panel--hero" hidden>
    <div class="nc-panel__head"><h2 class="nc-panel__title">Pairing code</h2></div>
    <div id="code" class="code"></div>
    <p>Check that the game shows the same code, then press <b>Allow</b> there.</p>
  </section>

  <section id="refused" class="nc-panel" hidden>
    <div class="nc-panel__head"><h2 class="nc-panel__title">Not connected</h2></div>
    <p>This phone is not paired with this game, or its code ran out. In the game, open <b>EDGEmobile</b> and scan the QR code it shows.</p>
  </section>

  <section id="connected" class="nc-panel" hidden>
    <div class="nc-panel__head"><h2 class="nc-panel__title">Night City</h2><span id="signal" class="nc-panel__meta"></span></div>
    <div id="clockbox">
      <div id="clock" class="clock">--:--</div>
      <div class="rule"></div>
      <div id="date" class="date"></div>
    </div>
  </section>
</main>
<script src="/phone.js"></script>
</body>
</html>
